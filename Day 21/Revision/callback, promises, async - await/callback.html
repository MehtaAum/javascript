<script>
  //callback:- A function passed as an argument to another function

  //synchronous example:-

    function sum(a , b ){
       console.log(a + b);
       
    }

    function calculate(a , b , sumOfAB) {
        console.log(a , b );
        sumOfAB(a , b)
    }

    calculate(1,2, sum)

    //asynchronous example;-

    function hello(){
        console.log("hello aum");
        
    }

    setTimeout(hello , 5000)

    console.log("hi");
    

</script>
