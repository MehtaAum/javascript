<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

// When using async/await, we usually handle errors with try/catch instead of .then/.catch
// When using .then/.catch, we don’t usually need async/await

        function function1(showData){
            return new Promise((resolve , reject)=>{
               setTimeout(() => {
                    console.log("data : ",showData)
                    // reject("error occurred")
                    resolve()
               }, 4000);
            })
        }

        //Async await

        (async function example(){ //used iife: immediately invoked function expression
            await function1(1)
            await function1(2)
            await function1(3)
            await function1(4)
        })()
        
    </script>
</body>
</html>
