<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>
function function1(){
    return new Promise((resolve , reject) => {
        setTimeout(()=>{
            console.log("Data 1")
            resolve()
        }, 4000)
    })
}
function function2(){
    return new Promise((resolve , reject) => {
        setTimeout(()=>{
            console.log("Data 2")
            resolve()
        }, 4000)
    })
}
function function3(){
    return new Promise((resolve , reject) => {
        setTimeout(()=>{
            console.log("Data 3")
            resolve()
        }, 4000)
    })
}
function function4(){
    return new Promise((resolve , reject) => {
        setTimeout(()=>{
            console.log("Data 4")
            resolve()
        }, 4000)
    })
}


console.log("fetching data 1...")
function1()

.then(()=>{
    console.log("Fetching data 2...")
    return function2(); //Wait for function2 to complete before next step
})
.then(()=>{
    console.log("Fetching data 3...")
    return function3();
})
.then(()=>{
    console.log("Fetching data 4...")
    return function4();
})

.catch((err)=>{
    console.log("error occurred" , err)
})

</script>
    
</body>
</html>
